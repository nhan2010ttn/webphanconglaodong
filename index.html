<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#6366f1"/>
<title>Phân Công Trực Nhật</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="app-bg"></div>

<header class="topbar">
  <button class="back-btn hidden" id="backBtn" aria-label="Quay lại">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </button>
  <div class="title-wrap">
    <h1 id="pageTitle">Phân Công Trực Nhật</h1>
    <div class="breadcrumb hidden" id="breadcrumb"></div>
  </div>
  <button class="icon-btn" id="confessBtn" title="Mách lẻo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
  </button>
  <button class="icon-btn hidden" id="inboxBtn" title="Hộp thư">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
      <polyline points="22,6 12,13 2,6"/>
    </svg>
    <span class="badge hidden" id="inboxBadge">0</span>
  </button>
</header>

<main id="content"></main>

<button class="fab fab-secondary" id="fabConfess" title="Đăng mách lẻo">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="5" x2="12" y2="19"/>
    <line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
</button>

<button class="fab" id="fabAdmin" title="Quyền Admin">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="11" width="18" height="11" rx="2"/>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  </svg>
</button>

<div id="modalRoot"></div>
<div id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
